map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Use Docker's embedded DNS so upstreams resolve at request time, not startup.
# This lets the proxy start even if app containers aren't running yet.
resolver 127.0.0.11 valid=5s;

# -- Binder Quest --

server {
    listen 80;
    server_name binder-quest.test;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name binder-quest.test;

    ssl_certificate /etc/nginx/certs/binder-quest.test+2.pem;
    ssl_certificate_key /etc/nginx/certs/binder-quest.test+2-key.pem;

    location / {
        set $upstream_bq http://binder-quest-frontend:5173;
        proxy_pass $upstream_bq;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        add_header Cache-Control "no-store";
    }
}

